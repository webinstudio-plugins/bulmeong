  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@600;800&family=Song+Myung&display=swap');

    :root {
      --bg-abyss: #050408;
      --lacquer-dark: rgba(11, 9, 8, 0.88);
      --brass-line: rgba(218, 178, 114, 0.34);
      --brass-bright: #e6c687;
      --cinnabar: #b5331d;
      --ember-gold: #f09c42;
      --text-parchment: #f4eadc;
      --text-muted: rgba(244, 234, 220, 0.58);
      --font-title: 'Song Myung', 'Gowun Batang', serif;
      --font-serif: 'Gowun Batang', serif;
      --font-hand: 'Gaegu', 'Gowun Batang', cursive;
      --font-num: 'JetBrains Mono', ui-monospace, monospace;
      --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* Japanese and Chinese need their own glyphs; the Korean fonts above lack most kana/hanzi. */
    /* ja/zh use the device's own Mincho/Song fonts: web CJK fonts cost 0.8-1.2 MB here; only the ja note hand is loaded */
    :root:lang(ja) { --font-title: 'Hiragino Mincho ProN', 'Yu Mincho', YuMincho, 'Noto Serif JP', 'Noto Serif CJK JP', serif; --font-serif: var(--font-title); --font-hand: 'Klee One', var(--font-title); }
    :root:lang(zh-Hans) { --font-title: 'Songti SC', STSong, 'Noto Serif SC', 'Noto Serif CJK SC', SimSun, serif; --font-serif: var(--font-title); --font-hand: var(--font-title); }
    button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brass-bright); outline-offset: 2px; }
    .lang-select-wrap {
      position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px;
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--brass-bright); font-size: 14px;
    }
    .lang-select {
      height: 36px; padding: 0 10px;
      background: rgba(12, 9, 8, 0.78); color: var(--text-parchment);
      border: 1px solid var(--brass-line); border-radius: 4px;
      font-family: var(--font-ui); font-size: 14px;
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: var(--bg-abyss);
      color: var(--text-parchment);
      font-family: var(--font-serif);
      user-select: none;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(218, 178, 114, 0.4); border-radius: 2px; }

    /* ── Interactive Game Canvas Stage ─────────────────────────────────── */
    #stage {
      position: fixed; inset: 0; width: 100%; height: 100%;
      display: block; z-index: 1; cursor: pointer;
    }

    /* Floating Drag-and-Drop Talisman Ghost */
    .drag-ghost {
      position: fixed; left: 0; top: 0; z-index: 80;
      pointer-events: none; display: none;
      transform: translate(-50%, -50%) rotate(-3deg);
      padding: 8px 14px; border-radius: 3px;
      background: #f2e5ce;
      border: 1px solid #9e3b1c;
      box-shadow: 0 18px 42px rgba(0,0,0,0.9), 0 0 24px rgba(240, 130, 40, 0.5);
      color: #24160d; font-family: var(--font-title); font-size: 13px;
      align-items: center; gap: 8px; white-space: nowrap;
    }
    .drag-ghost.active { display: inline-flex; }
    .drag-ghost-seal {
      display: inline-block; padding: 1px 5px;
      border: 1px solid #9e3b1c; color: #9e3b1c;
      font-size: 10px; letter-spacing: 1px;
    }

    /* ── 1. Handcrafted Indie Game Title Screen (#title-screen) ────────── */
    .title-screen {
      position: fixed; inset: 0; z-index: 50;
      background:
        radial-gradient(circle at 50% 45%, rgba(5, 6, 10, 0.6) 0%, rgba(5, 6, 10, 0.9) 75%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 28px 20px; text-align: center;
      transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .title-screen.hidden {
      opacity: 0; pointer-events: none; transform: scale(1.04);
    }
    .title-seal-mark {
      width: 34px; height: 34px;
      border: 1.5px solid rgba(196, 62, 36, 0.85);
      color: #e05336;
      font-family: var(--font-title); font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 18px;
      box-shadow: inset 0 0 0 2px rgba(15, 8, 6, 0.9);
      background: rgba(24, 10, 8, 0.72);
    }
    .title-main {
      font-family: var(--font-title);
      font-size: clamp(32px, 7vw, 48px);
      font-weight: 400; letter-spacing: 8px;
      color: #f7efe2; margin: 0 0 8px;
      text-shadow: 0 4px 28px rgba(0,0,0,0.96), 0 0 36px rgba(240, 110, 30, 0.45);
    }
    .title-en {
      font-family: var(--font-serif);
      font-size: 13px; font-weight: 700; letter-spacing: 2px;
      color: rgba(230, 198, 135, 0.72);
      margin-bottom: 24px;
    }
    .title-divider {
      width: 120px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--brass-bright), transparent);
      margin-bottom: 22px; opacity: 0.55;
    }
    .title-desc {
      max-width: 380px; font-family: var(--font-serif); font-size: 13.5px; line-height: 1.8;
      color: rgba(244, 234, 220, 0.84); margin: 0 0 28px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.95);
      word-break: keep-all;
    }
    .title-desc b { color: var(--brass-bright); font-weight: 700; }

    .title-nick-box {
      width: min(100%, 290px);
      border-bottom: 1px solid rgba(230, 198, 135, 0.55);
      padding: 6px 4px 8px;
      margin-bottom: 26px;
      background: linear-gradient(180deg, transparent, rgba(16, 11, 9, 0.55));
    }
    .title-nick-box label {
      display: block; font-family: var(--font-serif); font-size: 11px;
      color: rgba(230, 198, 135, 0.78); margin-bottom: 6px; letter-spacing: 1.5px;
    }
    .title-nick-input {
      width: 100%; border: 0; background: transparent;
      color: #fff8ee; font-family: var(--font-title); font-size: 18px;
      text-align: center; letter-spacing: 2px;
      outline: none;
    }
    .title-nick-input::placeholder { color: rgba(244, 234, 220, 0.3); }

    .ignite-ember-btn {
      position: relative;
      min-width: 240px; height: 50px;
      padding: 0 28px;
      background: linear-gradient(180deg, #982916 0%, #63170b 100%);
      border: 1px solid #e2a86b;
      outline: 1px solid rgba(152, 41, 22, 0.5);
      outline-offset: 3px;
      color: #fbf2e3; font-family: var(--font-title); font-size: 16px;
      letter-spacing: 4px; cursor: pointer;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.85), 0 0 32px rgba(215, 75, 25, 0.35);
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .ignite-ember-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(180deg, #b3321b 0%, #781c0d 100%);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.9), 0 0 46px rgba(240, 105, 35, 0.55);
    }
    .ignite-ember-btn:active { transform: scale(0.97); }

    .title-server-pill {
      margin-top: 22px;
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-serif); font-size: 11.5px; color: rgba(244, 234, 220, 0.65);
      letter-spacing: 0.5px;
    }
    .server-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #d9822b; box-shadow: 0 0 8px #ff9f43;
      animation: pulse 2.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* ── 2. Diegetic Minimalist HUD Shell (No AI Rounded Dashboard Boxes!) ── */
    .ui-shell {
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom));
      max-width: 600px; margin: 0 auto;
    }
    .ui-shell > * { pointer-events: auto; }

    .top-hud-cluster {
      display: flex; flex-direction: column; gap: 8px;
    }

    /* Top Bar: Left Calligraphic Thermometer + Right Brass Sigil Seals */
    .game-top-hud {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }

    .hearth-plaque {
      flex: 1; min-width: 0;
      border: 0; color: inherit; font: inherit; text-align: left;
      padding: 4px 2px;
      background: linear-gradient(90deg, rgba(8, 6, 6, 0.68) 0%, rgba(8, 6, 6, 0.25) 85%, transparent 100%);
      border-left: 2px solid var(--brass-bright);
      padding-left: 10px;
      cursor: pointer;
    }
    .plaque-top-row {
      display: flex; align-items: baseline; gap: 10px;
      margin-bottom: 4px;
    }
    .plaque-temp {
      font-family: var(--font-title);
      font-size: 24px; color: #fff4e0;
      letter-spacing: 1px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.95), 0 0 18px rgba(255, 125, 35, 0.65);
    }
    .fire-stage-badge {
      font-family: var(--font-serif);
      font-size: 12px; font-weight: 700; color: var(--brass-bright);
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.95);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .combo-pill {
      padding: 1px 6px; border: 1px solid #ff922b;
      background: rgba(180, 40, 15, 0.85);
      color: #ffe8cc; font-family: var(--font-num); font-size: 10px; font-weight: 800;
      opacity: 0; transform: translateY(2px);
      transition: opacity 0.18s, transform 0.18s;
    }
    .combo-pill.show, .combo-pill.active {
      opacity: 1; transform: translateY(0);
    }

    /* Ultra-Thin Hairline Brass Mercury Gauge */
    .fatigue-bar-wrap {
      width: min(100%, 260px); height: 2px;
      background: rgba(255, 225, 180, 0.18);
      overflow: hidden; margin-bottom: 5px;
    }
    .fatigue-bar-fill {
      height: 100%; width: 35%;
      background: linear-gradient(90deg, #c86428, #ff9f43, #fff0c2);
      transition: width 0.15s linear;
    }
    .plaque-sub-row {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-serif); font-size: 11px; color: rgba(244, 234, 220, 0.72);
      text-shadow: 0 1px 6px rgba(0,0,0,0.95);
    }
    .plaque-sub-row strong { color: #f6dcb3; font-family: var(--font-num); font-weight: 600; }
    .lv0-test-btn {
      padding: 1px 6px;
      border: 1px solid rgba(218, 178, 114, 0.38);
      background: rgba(15, 11, 9, 0.7);
      color: rgba(230, 198, 135, 0.88);
      font-family: var(--font-serif); font-size: 10px;
      cursor: pointer;
    }
    .lv0-test-btn:hover { border-color: var(--brass-bright); color: #fff; }

    /* Right: 3 Engraved Brass Seal Buttons (Zero Emoji!) */
    .hud-medallions {
      display: flex; gap: 8px; flex: none;
    }
    .medallion-btn {
      width: 44px; height: 48px;
      background: rgba(12, 9, 8, 0.78);
      border: 1px solid rgba(218, 178, 114, 0.42);
      color: var(--text-parchment);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.75);
      transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
      padding: 0;
    }
    .medallion-btn:hover {
      transform: translateY(-2px);
      border-color: var(--brass-bright);
      background: rgba(28, 19, 14, 0.9);
    }
    .medallion-btn.gold-glow {
      border-color: rgba(230, 198, 135, 0.72);
    }
    .sigil-svg {
      width: 17px; height: 17px;
      stroke: var(--brass-bright); fill: none;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .medallion-label {
      font-family: var(--font-serif);
      font-size: 9.5px; font-weight: 700; color: rgba(244, 234, 220, 0.85);
      letter-spacing: 0.5px;
    }

    /* 4-Space Book-Tab Strip (Clean Calligraphic Underline Tabs, No Box!) */
    .quick-space-bar {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(218, 178, 114, 0.22);
      background: linear-gradient(180deg, rgba(8, 6, 6, 0.58), rgba(8, 6, 6, 0.25));
      padding: 0 4px;
    }
    .space-chip {
      flex: 1; height: 32px; border: 0;
      background: transparent;
      color: rgba(244, 234, 220, 0.56);
      font-family: var(--font-serif); font-size: 12px; font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer; position: relative;
      transition: color 0.2s ease;
      text-shadow: 0 2px 8px rgba(0,0,0,0.95);
    }
    .space-chip:hover { color: rgba(244, 234, 220, 0.88); }
    .space-chip.active {
      color: var(--brass-bright);
    }
    .space-chip.active::after {
      content: ''; position: absolute; left: 18%; right: 18%; bottom: -1px;
      height: 2px; background: var(--brass-bright);
      box-shadow: 0 0 8px rgba(240, 156, 66, 0.8);
    }

    /* Expandable World / Channel / Ranking Drawer */
    .world-drawer {
      background: rgba(12, 9, 8, 0.94);
      border: 1px solid var(--brass-line);
      padding: 14px;
      box-shadow: 0 22px 54px rgba(0,0,0,0.95);
      display: none; flex-direction: column; gap: 12px;
      max-height: 54vh;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    .world-drawer.open { display: flex; }
    .drawer-section-label {
      font-family: var(--font-serif);
      font-size: 11px; font-weight: 700; color: var(--brass-bright);
      margin-bottom: 6px; display: flex; justify-content: space-between;
      letter-spacing: 0.5px;
    }
    .room-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .lang-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

    .room-tab, .lang-btn {
      height: 32px; padding: 0 6px;
      border: 1px solid rgba(218, 178, 114, 0.22);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-family: var(--font-serif); font-size: 11.5px; font-weight: 700;
      cursor: pointer; transition: all 0.18s;
    }
    .room-tab.active, .lang-btn.active {
      background: rgba(181, 51, 29, 0.32);
      border-color: var(--brass-bright);
      color: #fff8ee;
    }

    .rank-strip {
      width: 100%; height: 34px; padding: 0 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(218, 178, 114, 0.25);
      display: flex; align-items: center; gap: 8px;
      font-size: 11.5px; color: #f6e7d3; cursor: pointer;
    }
    .rank-badge {
      padding: 1px 6px;
      border: 1px solid rgba(218, 178, 114, 0.45);
      color: var(--brass-bright); font-family: var(--font-serif); font-size: 10px; font-weight: 700;
    }
    .rank-word { flex: 1; text-align: left; font-family: var(--font-serif); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-count { font-family: var(--font-num); font-size: 11px; color: var(--text-muted); }

    .rank-drawer { display: flex; flex-direction: column; gap: 5px; padding-top: 6px; }
    .rank-list { display: grid; gap: 4px; }
    .rank-item {
      display: grid; grid-template-columns: 32px 1fr auto auto; align-items: center; gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid rgba(218, 178, 114, 0.12);
      font-size: 12px; cursor: pointer;
    }
    .rank-item:hover { background: rgba(218, 178, 114, 0.1); }
    .rank-no { font-family: var(--font-num); font-weight: 700; color: var(--brass-bright); font-size: 11px; }
    .rank-item-word { font-family: var(--font-serif); color: #fff6ea; }
    .rank-item-fires { font-family: var(--font-num); font-size: 11px; color: var(--text-muted); }
    .rank-item-burn-btn {
      padding: 2px 7px; border: 1px solid rgba(181, 51, 29, 0.6);
      color: #f4b898; font-size: 10px;
    }

    .sr-stats { display: none; }

    /* ── Poetic Oracle & Dying Fire Crisis Banner ───────────────────────── */
    .ash-oracle {
      position: fixed; left: 50%; top: 26%; transform: translate(-50%, -50%);
      width: min(90vw, 400px); text-align: center;
      pointer-events: none; z-index: 25;
      opacity: 0; transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .ash-oracle.show { opacity: 1; transform: translate(-50%, -42%); }
    .ash-oracle-tag {
      display: inline-block; padding: 2px 10px;
      font-family: var(--font-title); font-size: 11px; color: var(--brass-bright);
      background: rgba(12, 9, 8, 0.92);
      border: 1px solid var(--brass-line);
      margin-bottom: 6px; letter-spacing: 1px;
    }
    .ash-oracle-text {
      font-family: var(--font-serif);
      font-size: 14.5px; font-weight: 700; line-height: 1.65;
      color: #fffaf2;
      background: rgba(10, 8, 7, 0.9);
      border-top: 1px solid var(--brass-bright);
      border-bottom: 1px solid var(--brass-bright);
      padding: 12px 18px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.95);
      box-shadow: 0 18px 44px rgba(0,0,0,0.88);
      word-break: keep-all;
    }

    .dying-alert {
      position: fixed; left: 50%; top: 44%; transform: translate(-50%, -50%);
      width: min(88vw, 340px); padding: 10px 16px;
      background: rgba(24, 9, 8, 0.92);
      border: 1px solid rgba(205, 75, 50, 0.65);
      color: #f4c6b8; font-family: var(--font-serif); font-size: 12px; line-height: 1.55;
      text-align: center; word-break: keep-all;
      pointer-events: none; z-index: 14;
      opacity: 0; transition: opacity 0.4s ease;
    }
    .dying-alert.show { opacity: 1; }

    /* ── 3. Bottom Tactile Paper Talisman Hand (Inscryption / Little Inferno Physical Slips!) ── */
    .bottom-game-dock {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }

    .live-whisper-bar {
      font-family: var(--font-serif); font-size: 11.5px;
      color: rgba(244, 234, 220, 0.82);
      text-shadow: 0 2px 8px rgba(0,0,0,0.98);
      letter-spacing: 0.3px;
      max-width: 96%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding: 2px 10px;
    }

    /* Fanned Physical Paper Slips Rising from Bottom Edge (No Outer Container Box!) */
    .talisman-hand {
      display: flex; align-items: flex-end; justify-content: center;
      width: 100%;
      gap: 5px;
      padding: 4px 2px 2px;
      perspective: 700px;
    }

    .game-item-card {
      flex: 1; max-width: 104px;
      height: 82px;
      border-radius: 3px 3px 2px 2px;
      padding: 7px 5px 6px;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      cursor: grab; position: relative;
      box-shadow: 0 10px 24px rgba(0,0,0,0.85);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease;
      touch-action: none;
    }
    /* Subtle hand-fanned angles */
    .game-item-card:nth-child(1) { transform: rotate(-4deg) translateY(4px); }
    .game-item-card:nth-child(2) { transform: rotate(-2deg) translateY(1px); }
    .game-item-card:nth-child(3) { transform: rotate(0deg) translateY(-2px); z-index: 2; }
    .game-item-card:nth-child(4) { transform: rotate(2deg) translateY(1px); }
    .game-item-card:nth-child(5) { transform: rotate(4deg) translateY(4px); }

    .game-item-card:hover {
      transform: translateY(-14px) scale(1.05) rotate(0deg) !important;
      z-index: 6;
      box-shadow: 0 18px 36px rgba(0,0,0,0.95), 0 0 22px rgba(240, 135, 45, 0.45);
    }
    .game-item-card:active { transform: translateY(-8px) scale(0.97) !important; cursor: grabbing; }

    /* Card 1: Cinnabar Red-Gold Alchemy Talisman (주문·번뇌 쓰기) */
    .game-item-card.card-talisman {
      background: linear-gradient(170deg, #9c2b17 0%, #68180b 100%);
      border: 1px solid #e5b36b;
      color: #fdf2df;
    }
    .game-item-card.card-talisman::before {
      content: ''; position: absolute; inset: 3px;
      border: 1px solid rgba(229, 179, 107, 0.32); pointer-events: none;
    }

    /* Card 2: Cream Hanji Resignation Envelope (사직서) */
    .game-item-card.card-resign {
      background: linear-gradient(175deg, #efe4d0 0%, #d8c5a5 100%);
      border: 1px solid #8c6f4e;
      color: #261910;
    }
    .game-item-card.card-resign::before {
      content: ''; position: absolute; inset: 3px;
      border: 1px solid rgba(120, 40, 25, 0.25); pointer-events: none;
    }

    /* Card 3: Indigo Ledger Paper (물린 계좌) */
    .game-item-card.card-ledger {
      background: linear-gradient(175deg, #162234 0%, #0d1522 100%);
      border: 1px solid #5983b8;
      color: #d8e6f8;
    }
    .game-item-card.card-ledger::before {
      content: ''; position: absolute; inset: 3px;
      border: 1px solid rgba(89, 131, 184, 0.25); pointer-events: none;
    }

    /* Card 4: Aged Copper Time Slip (월요병 시계) */
    .game-item-card.card-clock {
      background: linear-gradient(175deg, #2d1c1a 0%, #1a100f 100%);
      border: 1px solid #b86b52;
      color: #f4dcd3;
    }
    .game-item-card.card-clock::before {
      content: ''; position: absolute; inset: 3px;
      border: 1px solid rgba(184, 107, 82, 0.25); pointer-events: none;
    }

    /* Card 5: Charred Oak Wood Tag (참나무 장작) */
    .game-item-card.card-wood {
      background: linear-gradient(175deg, #382417 0%, #1f130c 100%);
      border: 1px solid #c48f52;
      color: #f5e3c8;
    }
    .game-item-card.card-wood::before {
      content: ''; position: absolute; inset: 3px;
      border: 1px solid rgba(196, 143, 82, 0.25); pointer-events: none;
    }

    .card-hanja-seal {
      font-family: var(--font-title);
      font-size: 10px; letter-spacing: 1px;
      padding: 1px 5px;
      border: 1px solid currentColor;
      opacity: 0.82;
      pointer-events: none;
    }
    .card-resign .card-hanja-seal { color: #9e2a1b; border-color: #9e2a1b; }
    .card-talisman .card-hanja-seal { color: #f6d28b; border-color: #f6d28b; }

    .item-name {
      font-family: var(--font-title);
      font-size: 12px;
      letter-spacing: 0.5px;
      white-space: nowrap; pointer-events: none;
    }
    .item-sub {
      font-family: var(--font-num);
      font-size: 9px; font-weight: 600;
      opacity: 0.72;
      pointer-events: none;
    }

    /* Subtle Secondary Utility Bar Below Cards */
    .dock-sub-actions {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding-top: 2px;
    }
    .sub-action-btn {
      background: transparent; border: 0;
      border-bottom: 1px solid transparent;
      color: rgba(244, 234, 220, 0.68);
      font-family: var(--font-serif); font-size: 11.5px; font-weight: 700;
      padding: 2px 4px;
      cursor: pointer;
      text-shadow: 0 2px 6px rgba(0,0,0,0.95);
      transition: color 0.15s, border-color 0.15s;
    }
    .sub-action-btn:hover {
      color: var(--brass-bright);
      border-bottom-color: var(--brass-bright);
    }

    /* ── Tactile Hanji Swipe-to-Burn Overlay ────────────────────────────── */
    .hanji-overlay {
      position: fixed; inset: 0; z-index: 35;
      background: radial-gradient(circle at 50% 60%, rgba(24, 13, 8, 0.6), rgba(4, 4, 8, 0.92));
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: none; flex-direction: column; align-items: center; justify-content: flex-end;
      padding: 20px 16px max(24px, env(safe-area-inset-bottom));
      overflow-y: auto;
    }
    .hanji-overlay.open { display: flex; }

    .swipe-guide {
      text-align: center; margin-bottom: 12px; pointer-events: none;
      animation: floatUp 2s infinite ease-in-out;
    }
    @keyframes floatUp {
      0%, 100% { transform: translateY(0); opacity: 0.75; }
      50% { transform: translateY(-6px); opacity: 1; }
    }
    .swipe-arrow { font-family: var(--font-title); font-size: 20px; color: var(--brass-bright); display: block; }
    .swipe-guide span { font-family: var(--font-serif); font-size: 12.5px; color: #f4e2c6; }

    .hanji-sheet {
      width: min(100%, 410px);
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 252, 244, 0.45), transparent 60%),
        linear-gradient(165deg, #f4e8d4 0%, #e5d0ae 55%, #d6bc92 100%);
      color: #26180e;
      border-radius: 4px;
      border: 1px solid #9e7b56;
      padding: 18px 18px 15px;
      box-shadow: 0 28px 64px rgba(0, 0, 0, 0.92);
      position: relative;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
    }
    .hanji-sheet.dragging { transition: none; }
    .hanji-sheet.golden {
      background:
        radial-gradient(circle at 22% 18%, rgba(255, 252, 220, 0.96), transparent 55%),
        linear-gradient(155deg, #ffe799 0%, #f4c145 52%, #d49019 100%);
      border: 1.5px solid #fff3bd;
    }

    .hanji-top {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(95, 65, 35, 0.25);
      padding-bottom: 9px; margin-bottom: 10px;
    }
    .hanji-stamp {
      font-family: var(--font-title);
      font-size: 12px; color: #9e2a1b;
      border: 1.5px solid #9e2a1b;
      padding: 2px 7px; letter-spacing: 1px;
    }
    .gold-toggle-btn {
      padding: 4px 10px;
      border: 1px solid #8c5812;
      background: rgba(215, 145, 25, 0.18);
      color: #5c3406; font-family: var(--font-serif); font-size: 11.5px; font-weight: 700;
      cursor: pointer;
    }
    .hanji-sheet.golden .gold-toggle-btn {
      background: #7c2410; color: #ffefb8; border-color: #7c2410;
    }
    .hanji-close {
      border: 0; background: transparent;
      color: #5a3e28; width: 28px; height: 28px;
      font-size: 16px; cursor: pointer;
    }

    .hanji-chips {
      display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px;
      max-height: 88px; overflow-y: auto;
      overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    .hanji-chip {
      padding: 3px 8px;
      background: rgba(90, 58, 28, 0.08);
      border: 1px solid rgba(90, 58, 28, 0.24);
      color: #3d2715; font-family: var(--font-serif); font-size: 11.5px; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
    }
    .hanji-chip:hover {
      background: #9e2a1b; color: #fff8ee; border-color: #9e2a1b;
    }

    .hanji-textarea {
      width: 100%; height: 84px; border: 0; background: transparent;
      resize: none; outline: none;
      color: #23160c; font-family: var(--font-hand); font-size: 21px; font-weight: 700;
      line-height: 1.4;
    }
    .hanji-textarea::placeholder {
      color: rgba(75, 50, 28, 0.48); font-family: var(--font-serif); font-size: 13.5px;
    }

    .hanji-foot {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-top: 6px; padding-top: 10px;
      border-top: 1px solid rgba(95, 65, 35, 0.2);
    }
    .hanji-hint { font-family: var(--font-serif); font-size: 11.5px; color: rgba(75, 50, 28, 0.75); font-weight: 700; line-height: 1.4; }
    :root:lang(ko) .hanji-hint { word-break: keep-all; }
    :root:lang(ja) .hanji-hint { word-break: auto-phrase !important; }
    .hanji-burn-cta {
      height: 38px; padding: 0 18px; border: 1px solid #e5b36b;
      background: linear-gradient(180deg, #9e2a1b, #69180d);
      color: #fff8f0; font-family: var(--font-title); font-size: 13.5px; letter-spacing: 1px;
      cursor: pointer; flex: none; white-space: nowrap;
    }

    /* ── Modals (Museum, Checkout, Audio, Cert, Guestbook) ──────────────── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 45;
      background: rgba(4, 4, 8, 0.86);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      display: none; align-items: center; justify-content: center; padding: 14px;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      width: min(100%, 430px);
      max-height: 90vh;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      background: #120e0d;
      border: 1px solid var(--brass-line);
      padding: 18px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.95);
      color: var(--text-parchment);
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(218, 178, 114, 0.18);
      padding-bottom: 10px; margin-bottom: 14px;
    }
    .modal-head h2 { margin: 0; font-family: var(--font-title); font-size: 16.5px; font-weight: 400; color: var(--brass-bright); letter-spacing: 1px; }
    .close-btn {
      width: 28px; height: 28px; border: 1px solid rgba(218, 178, 114, 0.25);
      background: transparent; color: var(--text-parchment); cursor: pointer; flex: none;
    }
    .slider-row { margin-bottom: 14px; }
    .slider-row label {
      display: flex; justify-content: space-between;
      font-family: var(--font-serif); font-size: 13px; color: var(--text-muted); margin-bottom: 6px;
    }
    .slider-row input[type=range] { width: 100%; accent-color: #c86428; }
    #cert-canvas {
      width: 100%; height: auto;
      border: 1px solid rgba(218, 178, 114, 0.3);
      display: block; margin-bottom: 12px;
    }
    .modal-cta {
      width: 100%; height: 44px; border: 1px solid var(--brass-bright);
      background: linear-gradient(180deg, #982916, #63170b);
      color: #fff; font-family: var(--font-title); font-size: 14.5px; letter-spacing: 1px; cursor: pointer;
    }

    .myfire-section {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(218, 178, 114, 0.18);
      padding: 12px; margin-bottom: 10px;
    }
    .myfire-section h3 {
      margin: 0 0 8px; font-family: var(--font-serif); font-size: 12.5px; color: var(--brass-bright); font-weight: 700;
    }
    .myfire-input-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .myfire-input {
      flex: 1; height: 34px; padding: 0 10px;
      border: 1px solid rgba(218, 178, 114, 0.28);
      background: rgba(6, 5, 7, 0.9); color: #fff6ea;
      font-family: var(--font-serif); font-size: 12.5px; outline: none;
    }
    .myfire-sub-btn {
      height: 34px; padding: 0 12px;
      background: rgba(218, 178, 114, 0.15);
      border: 1px solid var(--brass-line);
      color: var(--brass-bright); font-family: var(--font-serif); font-size: 12px; font-weight: 700; cursor: pointer;
      white-space: nowrap;
    }
    .guestbook-list {
      display: grid; gap: 6px; max-height: 150px; overflow-y: auto;
      overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      margin-top: 8px;
    }
    .guestbook-item {
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.025);
      border-left: 2px solid var(--brass-bright);
      font-family: var(--font-hand); font-size: 15px; color: #f8ebd8;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }

    .pay-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 12px 0; }
    .pay-method-btn {
      height: 48px;
      border: 1px solid var(--brass-bright);
      background: linear-gradient(180deg, #162844, #0d182b);
      color: #fff8ee; font-family: var(--font-serif); font-size: 13.5px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; transition: all 0.18s;
    }
    .pay-method-btn:hover { border-color: #fff; }
    .checkout-perk-list {
      margin: 0 0 10px; padding: 11px 13px;
      background: rgba(218, 178, 114, 0.06);
      border: 1px solid rgba(218, 178, 114, 0.22);
      font-family: var(--font-serif); font-size: 12px; color: #f8e8ce; line-height: 1.7;
    }

    /* ── Auto-Capture Flash & Floating Polaroid Toast ───────────────────── */
    .camera-flash {
      position: fixed; inset: 0; z-index: 60;
      background: #fff9e6; opacity: 0; pointer-events: none;
      transition: opacity 0.45s ease-out;
    }
    .camera-flash.flash { opacity: 0.85; transition: none; }

    .capture-toast {
      position: fixed; right: 16px; bottom: 136px; z-index: 38;
      width: min(88vw, 320px);
      background: rgba(14, 10, 9, 0.96);
      border: 1px solid var(--brass-bright);
      padding: 9px;
      box-shadow: 0 16px 42px rgba(0,0,0,0.92);
      display: flex; align-items: center; gap: 10px;
      transform: translateY(24px); opacity: 0; pointer-events: none;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }
    .capture-toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .capture-toast img {
      width: 66px; height: 48px; object-fit: cover;
      border: 1px solid var(--brass-line); flex: none;
    }
    .capture-toast-info { flex: 1; min-width: 0; }
    .capture-toast-tag { font-size: 10px; font-weight: 700; color: var(--brass-bright); display: block; margin-bottom: 2px; }
    .capture-toast-title {
      font-family: var(--font-title); font-size: 13px; color: #fff8ee;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .capture-toast-sub { font-family: var(--font-serif); font-size: 10.5px; color: var(--text-muted); }

    /* ── Easter Egg Hall of Fame Album Modal (#modal-album) ─────────────── */
    .album-card { width: min(100%, 470px); max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
    .album-progress-wrap {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(218, 178, 114, 0.2);
      padding: 10px 12px; margin-bottom: 10px; flex: none;
    }
    .album-progress-top {
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--font-serif); font-size: 12px; margin-bottom: 6px; color: #ffe7c4; font-weight: 700;
    }
    .album-bar-bg { width: 100%; height: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .album-bar-fill { height: 100%; width: 0%; background: var(--brass-bright); transition: width 0.35s ease; }
    .album-filter-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 10px; flex: none; }
    .album-filter-btn {
      height: 30px; padding: 0 4px;
      border: 1px solid rgba(218, 178, 114, 0.2);
      background: transparent; color: var(--text-muted);
      font-family: var(--font-serif); font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .album-filter-btn.active {
      background: rgba(181, 51, 29, 0.28);
      border-color: var(--brass-bright); color: var(--brass-bright);
    }
    .album-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 9px;
      overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      padding-right: 4px; flex: 1; min-height: 220px; touch-action: pan-y;
    }
    .egg-slot {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(218, 178, 114, 0.16);
      padding: 9px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .egg-slot.unlocked {
      background: linear-gradient(165deg, rgba(181, 51, 29, 0.14), rgba(16, 12, 11, 0.96));
      border-color: rgba(218, 178, 114, 0.5);
    }
    .egg-thumb { width: 100%; aspect-ratio: 16 / 10; background: #090a10; object-fit: cover; margin-bottom: 7px; display: block; }
    .egg-locked-box {
      width: 100%; aspect-ratio: 16 / 10;
      background: rgba(0, 0, 0, 0.35);
      border: 1px dashed rgba(218, 178, 114, 0.22);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin-bottom: 7px; color: rgba(218, 178, 114, 0.45); font-family: var(--font-title); font-size: 14px;
    }
    .egg-tier-badge {
      display: inline-block; padding: 1px 5px;
      border: 1px solid rgba(218, 178, 114, 0.35);
      font-family: var(--font-num); font-size: 9px; font-weight: 700; margin-bottom: 4px; width: fit-content;
      color: var(--brass-bright);
    }
    .egg-title { font-family: var(--font-title); font-size: 12.5px; color: #fff7eb; margin-bottom: 3px; line-height: 1.3; }
    .egg-hint { font-family: var(--font-serif); font-size: 10.5px; color: rgba(244, 234, 220, 0.68); line-height: 1.45; margin-bottom: 6px; word-break: keep-all; }
    .egg-discoverer {
      font-family: var(--font-serif); font-size: 10px; color: var(--brass-bright);
      border-top: 1px solid rgba(218, 178, 114, 0.18); padding-top: 5px; margin-bottom: 6px;
    }
    .egg-actions { display: flex; gap: 4px; }
    .egg-act-btn {
      flex: 1; height: 26px; border: 1px solid rgba(218, 178, 114, 0.32);
      background: rgba(218, 178, 114, 0.12);
      color: var(--brass-bright); font-family: var(--font-serif); font-size: 10.5px; font-weight: 700; cursor: pointer;
    }

    /* ── v9: Codex objects as cards, paper sheet ── */
    .game-item-card, .game-item-card.card-resign, .game-item-card.card-ledger, .game-item-card.card-talisman, .game-item-card.card-clock, .game-item-card.card-wood {
      background: none; border: 0; box-shadow: none; color: #fbf1df;
      height: auto; padding: 0 2px 2px; gap: 3px; justify-content: flex-end;
    }
    .game-item-card::before { display: none; }
    .game-item-card:hover { box-shadow: none; }
    .card-art {
      width: 100%; max-width: 78px; height: 60px; object-fit: contain;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.75));
      pointer-events: none; user-select: none;
    }
    .item-name {
      font-family: var(--font-serif); font-size: 13px; font-weight: 700; line-height: 1.2;
      white-space: normal; text-align: center;
      text-shadow: 0 1px 2px #000, 0 2px 10px rgba(0, 0, 0, 0.95);
    }
    .item-sub { font-size: 11px; color: rgba(255, 228, 196, 0.8); text-shadow: 0 1px 3px #000; }
    .game-item-card.primary-scroll .item-name { color: #ffd79a; }
    .hanji-sheet {
      background: linear-gradient(165deg, rgba(255, 250, 238, 0.35), rgba(214, 188, 146, 0.25)), url('./assets/ui/paper.webp') center/cover;
    }
    .space-chip[hidden] { display: none; }
    .item-name { font-size: 11.5px; overflow-wrap: normal; }
    .talisman-hand { gap: 2px; }
    :root:lang(ja) .item-name { word-break: auto-phrase !important; }
    @media (max-width: 420px) { .ui-shell { padding-left: 10px; padding-right: 10px; } }
    :root:lang(ko) .item-name { word-break: keep-all; }
    /* keep-all is a Korean rule; Japanese and Chinese have no spaces and must break between characters */
    :root:lang(ja) *, :root:lang(zh-Hans) * { word-break: normal !important; line-break: strict; }
    .title-nick-input { font-size: 16px; letter-spacing: 0.5px; }
    .title-nick-input::placeholder { font-size: 13px; letter-spacing: 0; }
    #title-screen:not(.hidden) ~ #ui-shell { opacity: 0; pointer-events: none; }
    #ui-shell { transition: opacity 0.6s ease; }

    /* ── v9b: menu, readable sizes, leave-it-on mode ── */
    .plaque-temp { font-size: 15px; }
    .fire-stage-badge { font-size: 16px; color: #fff1d8; }
    .plaque-sub-row, .medallion-label { font-size: 12px; }
    .medallion-btn { width: 52px; height: 50px; }
    .world-drawer { font-size: 13px; }
    .drawer-section-label, .rank-drawer-head { font-size: 12.5px; }
    .rank-drawer-head { display: flex; justify-content: space-between; color: var(--text-muted); margin: 4px 2px; }
    .room-tab, .lang-btn, .space-chip { font-size: 13px; min-height: 40px; }
    .rank-item, .rank-strip { font-size: 13px; }
    .rank-no, .rank-item-fires, .rank-count, .rank-badge, .rank-item-burn-btn { font-size: 12px; }
    .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .menu-btn {
      min-height: 52px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      border: 1px solid rgba(218, 178, 114, 0.3); background: rgba(255, 255, 255, 0.04);
      color: var(--text-parchment); font-family: var(--font-serif); font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .menu-btn:hover { border-color: var(--brass-bright); }
    .live-whisper-bar { font-size: 12.5px; }
    .sub-action-btn { font-size: 13px; }
    .hanji-chip, .hanji-hint { font-size: 13px; }
    .egg-hint, .egg-discoverer, .album-filter-btn, .egg-act-btn { font-size: 12px; }
    .egg-tier-badge { font-size: 11px; }
    .capture-toast-tag { font-size: 12px; }
    .capture-toast-sub { font-size: 12px; }
    .dying-alert { font-size: 13px; }
    .share-save { width: 100%; height: 40px; margin-top: 8px; }
    .idle-bar {
      position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translate(-50%, 12px);
      z-index: 70; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: rgba(12, 9, 8, 0.88); border: 1px solid var(--brass-line); color: var(--text-parchment);
      font-family: var(--font-serif); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .idle-bar select { margin-left: 6px; height: 34px; background: #120e0d; color: var(--text-parchment); border: 1px solid var(--brass-line); font-size: 13px; }
    body.idle #ui-shell, body.idle .ash-oracle, body.idle .capture-toast, body.idle .dying-alert { opacity: 0 !important; pointer-events: none !important; }
    body.idle.idle-bar-on .idle-bar { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    body.idle #stage { cursor: none; }
    .audio-credits { margin: 12px 0 0; font-family: var(--font-ui); font-size: 11px; line-height: 1.6; color: var(--text-muted); }
    .audio-credits a { color: var(--brass-bright); }
    .ui-shell:has(.world-drawer.open) ~ .ash-oracle, body:has(.world-drawer.open) .ash-oracle { opacity: 0; }
  </style>
</head>
<body>
  <canvas id="stage" role="img" data-i18n-attr="aria-label:meta.title"></canvas>
  <div class="camera-flash" id="camera-flash"></div>
  <div class="drag-ghost" id="drag-ghost">
    <span class="drag-ghost-seal" id="drag-ghost-icon">🔥</span>
    <span id="drag-ghost-label"></span>
  </div>

  <!-- 1. Title screen: language first, then one button -->
  <section class="title-screen" id="title-screen" data-i18n-attr="aria-label:meta.title">
    <label class="lang-select-wrap">
      <span aria-hidden="true">🌐</span>
      <select class="lang-select" id="title-lang-select" data-i18n-attr="aria-label:common.lang">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
        <option value="es">Español</option>
      </select>
    </label>
    <div class="title-seal-mark" aria-hidden="true">火</div>
    <h1 class="title-main" data-i18n="title.name">불멍</h1>
    <div class="title-en" data-i18n="title.tagline"></div>
    <div class="title-divider"></div>
    <p class="title-desc" data-i18n="title.desc"></p>
    <div class="title-nick-box">
      <label for="intro-nick-input" data-i18n="title.nickLabel"></label>
      <input type="text" id="intro-nick-input" class="title-nick-input" maxlength="14" data-i18n-attr="placeholder:title.nickPh">
    </div>
    <button type="button" class="ignite-ember-btn" id="btn-ignite-start">
      <span data-i18n="title.start"></span>
    </button>
    <div class="title-server-pill">
      <span class="server-dot"></span>
      <span id="intro-server-status" data-i18n="title.live"></span>
    </div>
  </section>

  <!-- Capture toast -->
  <div class="capture-toast" id="capture-toast" role="status" aria-live="polite" data-i18n-attr="title:album.title">
    <img id="capture-toast-img" src="" alt="">
    <div class="capture-toast-info">
      <span class="capture-toast-tag" id="capture-toast-tag"></span>
      <div class="capture-toast-title" id="capture-toast-title"></div>
      <div class="capture-toast-sub" id="capture-toast-sub"></div>
    </div>
  </div>

  <!-- Oracle banner -->
  <div class="ash-oracle" id="ash-oracle" role="status" aria-live="polite">
    <span class="ash-oracle-tag" id="oracle-tag"></span>
    <div class="ash-oracle-text" id="oracle-text"></div>
  </div>

  <!-- Dying fire notice (Lv.0 only) -->
  <div class="dying-alert" id="dying-fire-alert" data-i18n="dying.text"></div>

  <!-- 2. HUD -->
  <div class="ui-shell" id="ui-shell">
    <div class="top-hud-cluster">
      <header class="game-top-hud">
        <button type="button" class="hearth-plaque" id="btn-fire-stage" data-i18n-attr="title:hud.stageTitle">
          <div class="plaque-top-row">
            <span class="plaque-temp" id="stat-heat">440°C</span>
            <span class="fire-stage-badge" id="fire-stage-badge"></span>
            <span class="combo-pill" id="combo-pill">2x</span>
          </div>
          <div class="fatigue-bar-wrap">
            <div class="fatigue-bar-fill" id="fatigue-bar-fill"></div>
          </div>
          <div class="plaque-sub-row">
            <span><span data-i18n="hud.online"></span> <strong id="live-count">1</strong> · <span data-i18n="hud.total"></span> <strong id="global-burn-total">0</strong></span>
          </div>
        </button>

        <div class="hud-medallions">
          <button type="button" class="medallion-btn gold-glow" id="btn-open-album" data-i18n-attr="title:hud.albumTitle;aria-label:hud.albumTitle">
            <svg class="sigil-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              <path d="M12 7c1.5 2 2.5 3.5 2 5.5-.4 1.4-1.5 2-2 2s-1.6-.6-2-2c-.5-2 .5-3.5 2-5.5z"/>
            </svg>
            <span class="medallion-label" id="album-count-badge">0/20</span>
          </button>
          <button type="button" class="medallion-btn" id="btn-world-toggle" aria-controls="world-drawer" aria-expanded="false" data-i18n-attr="title:hud.menu">
            <svg class="sigil-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            <span class="medallion-label" data-i18n="hud.menu"></span>
          </button>
        </div>
      </header>

      <section class="world-drawer" id="world-drawer">
        <div>
          <div class="drawer-section-label"><span data-i18n="hud.spaces"></span></div>
          <div class="quick-space-bar" role="group" data-i18n-attr="aria-label:hud.spaces">
            <button type="button" class="space-chip active" data-space="camp" data-i18n="space.camp"></button>
            <button type="button" class="space-chip" data-space="temple" data-i18n="space.temple"></button>
            <button type="button" class="space-chip" data-space="snow" data-i18n="space.snow"></button>
            <button type="button" class="space-chip" data-space="cosmos" data-i18n="space.cosmos"></button>
          </div>
        </div>

        <div class="menu-grid">
          <button type="button" class="menu-btn" id="btn-audio"><span aria-hidden="true">🔊</span><span id="audio-label" data-i18n="hud.sound"></span></button>
          <button type="button" class="menu-btn" id="btn-powder"><span aria-hidden="true">✨</span><span data-i18n="dock.powder"></span></button>
          <button type="button" class="menu-btn" id="btn-idle"><span aria-hidden="true">🌙</span><span data-i18n="idle.enter"></span></button>
        </div>

        <div>
          <button type="button" class="rank-strip" id="btn-rank-toggle" aria-expanded="true">
            <span class="rank-badge" data-i18n="rank.top"></span>
            <span class="rank-word" id="top-rank-word"></span>
            <span class="rank-count" id="top-rank-count"></span>
          </button>
          <div class="rank-drawer open" id="rank-drawer">
            <div class="rank-drawer-head">
              <span data-i18n="rank.heading"></span>
              <span data-i18n="rank.hint"></span>
            </div>
            <div class="rank-list" id="rank-list"></div>
          </div>
        </div>

        <div>
          <div class="drawer-section-label"><span data-i18n="drawer.lang"></span></div>
          <div class="lang-bar">
            <button type="button" class="lang-btn" data-lang="ko">한국어</button>
            <button type="button" class="lang-btn" data-lang="en">English</button>
            <button type="button" class="lang-btn" data-lang="ja">日本語</button>
            <button type="button" class="lang-btn" data-lang="zh">中文</button>
            <button type="button" class="lang-btn" data-lang="es">Español</button>
          </div>
        </div>
      </section>
    </div>

    <!-- Hidden stat holders -->
    <div class="sr-stats">
      <span id="zen-timer">00:00</span>
      <span id="stat-burned">0</span>
      <span id="stat-warmth">0</span>
      <span id="essence-count">0</span>
    </div>

    <!-- 3. Throwable cards -->
    <footer class="bottom-game-dock">
      <div class="live-whisper-bar" id="live-ticker" data-i18n="ticker.idle"></div>

      <div class="talisman-hand" role="group" data-i18n-attr="aria-label:card.group">
        <button type="button" class="game-item-card card-resign" data-throw-item="resignation">
          <img class="card-art" src="./assets/objects/resignation.webp" alt="" draggable="false">
          <span class="item-name" data-i18n="card.resign"></span>
          <span class="item-sub">+65°C</span>
        </button>
        <button type="button" class="game-item-card card-ledger" data-throw-item="stock">
          <img class="card-art" src="./assets/objects/stock-chart.webp" alt="" draggable="false">
          <span class="item-name" data-i18n="card.stock"></span>
          <span class="item-sub">+65°C</span>
        </button>
        <button type="button" class="game-item-card card-talisman primary-scroll" id="btn-open-hanji">
          <img class="card-art" src="./assets/objects/note.webp" alt="" draggable="false">
          <span class="item-name" data-i18n="card.write"></span>
          <span class="item-sub">+95°C</span>
        </button>
        <button type="button" class="game-item-card card-clock" data-throw-item="clock">
          <img class="card-art" src="./assets/objects/alarm-clock.webp" alt="" draggable="false">
          <span class="item-name" data-i18n="card.clock"></span>
          <span class="item-sub">+65°C</span>
        </button>
        <button type="button" class="game-item-card card-wood" id="btn-wood" data-throw-item="wood">
          <img class="card-art" src="./assets/objects/firewood.webp" alt="" draggable="false">
          <span class="item-name" data-i18n="card.wood"></span>
          <span class="item-sub">+45°C</span>
        </button>
      </div>

      <div class="dock-sub-actions">
        <button type="button" class="sub-action-btn" id="btn-cert"><span aria-hidden="true">📷</span> <span data-i18n="share.open"></span></button>
      </div>
    </footer>
  </div>

  <!-- Write-and-burn sheet -->
  <div class="hanji-overlay" id="hanji-overlay" role="dialog" aria-modal="true" data-i18n-attr="aria-label:sheet.label">
    <div class="swipe-guide">
      <span class="swipe-arrow">↑</span>
      <span data-i18n="sheet.guide"></span>
    </div>

    <div class="hanji-sheet" id="hanji-sheet">
      <div class="hanji-top">
        <span class="hanji-stamp" id="hanji-room-stamp"></span>
        <div style="display:flex; gap:6px; align-items:center;">
          <button type="button" class="gold-toggle-btn" id="btn-gold-talisman" hidden></button>
          <button type="button" class="hanji-close" id="btn-close-hanji" data-i18n-attr="aria-label:common.close">✕</button>
        </div>
      </div>

      <div class="hanji-chips" id="hanji-chips"></div>

      <textarea id="burn-input" class="hanji-textarea" maxlength="60" data-i18n-attr="placeholder:sheet.ph"></textarea>

      <div class="hanji-foot">
        <span class="hanji-hint" data-i18n="sheet.hint"></span>
        <button type="button" class="hanji-burn-cta" id="burn-btn" data-i18n="sheet.burn"></button>
      </div>
    </div>
  </div>

  <!-- Sound -->
  <div class="modal-backdrop" id="modal-audio" role="dialog" aria-modal="true" aria-labelledby="audio-modal-title">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="audio-modal-title" data-i18n="audio.title"></h2>
        <button type="button" class="close-btn" data-close="modal-audio" data-i18n-attr="aria-label:common.close">✕</button>
      </div>
      <div class="slider-row">
        <label for="vol-fire"><span data-i18n="audio.fire"></span><strong id="val-fire">75%</strong></label>
        <input type="range" id="vol-fire" min="0" max="100" value="75">
      </div>
      <div class="slider-row">
        <label for="vol-rain"><span data-i18n="audio.rain"></span><strong id="val-rain">55%</strong></label>
        <input type="range" id="vol-rain" min="0" max="100" value="55">
      </div>
      <div class="slider-row">
        <label for="vol-chime"><span data-i18n="audio.chime"></span><strong id="val-chime">70%</strong></label>
        <input type="range" id="vol-chime" min="0" max="100" value="70">
      </div>
      <button type="button" class="modal-cta" id="btn-toggle-mute" data-i18n="audio.off"></button>
      <p class="audio-credits">
        <a href="https://commons.wikimedia.org/wiki/File:Campfire_sound_ambience.ogg" target="_blank" rel="noopener">Campfire sound ambience</a> · Glaneur de sons · CC BY 3.0<br>
        <a href="https://commons.wikimedia.org/wiki/File:Rain_on_a_veranda_and_t.ogg" target="_blank" rel="noopener">Rain on a veranda</a> · ezwa · Public domain<br>
        <a href="https://commons.wikimedia.org/wiki/File:Windglockenspiel.Koshi.ogg" target="_blank" rel="noopener">Windglockenspiel Koshi</a> · Membeth · CC0
      </p>
    </div>
  </div>

  <!-- Record card -->
  <div class="modal-backdrop" id="modal-cert" role="dialog" aria-modal="true" aria-labelledby="cert-modal-title">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="cert-modal-title" data-i18n="cert.title"></h2>
        <button type="button" class="close-btn" data-close="modal-cert" data-i18n-attr="aria-label:common.close">✕</button>
      </div>
      <canvas id="cert-canvas" width="1080" height="1350"></canvas>
      <button type="button" class="modal-cta" id="btn-share-card" data-i18n="share.btn"></button>
      <button type="button" class="myfire-sub-btn share-save" id="btn-download-cert" data-i18n="cert.save"></button>
    </div>
  </div>

  <!-- Secret flame album -->
  <div class="modal-backdrop" id="modal-album" role="dialog" aria-modal="true" aria-labelledby="album-modal-title">
    <div class="modal-card album-card">
      <div class="modal-head" style="margin-bottom:10px;flex:none;">
        <h2 id="album-modal-title" data-i18n="album.title"></h2>
        <button type="button" class="close-btn" data-close="modal-album" data-i18n-attr="aria-label:common.close">✕</button>
      </div>

      <div class="album-progress-wrap">
        <div class="album-progress-top">
          <span id="album-progress-text"></span>
        </div>
        <div class="album-bar-bg">
          <div class="album-bar-fill" id="album-bar-fill"></div>
        </div>
        <div class="myfire-input-row" style="margin-top:8px;margin-bottom:0;">
          <input type="text" id="discoverer-name-input" class="myfire-input" style="height:32px;font-size:12px;" maxlength="14" data-i18n-attr="placeholder:album.nickPh;aria-label:album.nickPh">
          <button type="button" class="myfire-sub-btn" id="btn-save-discoverer" style="height:32px;" data-i18n="album.nickSave"></button>
        </div>
      </div>

      <div class="album-filter-bar" role="group">
        <button type="button" class="album-filter-btn active" data-filter="all"></button>
        <button type="button" class="album-filter-btn" data-filter="unlocked" data-i18n="album.unlocked"></button>
        <button type="button" class="album-filter-btn" data-filter="locked" data-i18n="album.locked"></button>
        <button type="button" class="album-filter-btn" data-filter="mythic" data-i18n="album.mythic"></button>
      </div>

      <div class="album-grid" id="album-grid"></div>
    </div>
  </div>

  <!-- Leave-it-on mode controls (shown for a few seconds after a tap) -->
  <div class="idle-bar" id="idle-bar">
    <label><span data-i18n="idle.timer"></span>
      <select id="idle-timer"></select>
    </label>
    <button type="button" class="myfire-sub-btn" id="btn-idle-exit" data-i18n="idle.exit"></button>
  </div>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
