name: deploy
on:
  push:
    branches: [master]

concurrency: deploy

jobs:
  # Static site, no build: master is copied to S3 as is (docs, infra and git files stay out).
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write   # OIDC 토큰
      contents: read
    env:
      BUCKET: ${{ vars.BUCKET }}
      DIST_ID: ${{ vars.DIST_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          aws-region: us-east-1
      - name: Build language pages
        run: node scripts/i18n-pages.mjs
      - name: Deploy
        run: |
          X=(--exclude '.git/*' --exclude '.github/*' --exclude '.gitignore' --exclude 'docs/*' --exclude 'infra/*' --exclude 'tools/*' --exclude 'scripts/*' --exclude 'i18n/check.mjs' --exclude '*.md')
          IMG=(--include '*.jpg' --include '*.png' --include '*.webp' --include '*.ico' --include '*.svg')
          aws s3 sync . "s3://$BUCKET" --delete "${X[@]}" --exclude '*.mjs' --exclude '*.jpg' --exclude '*.png' --exclude '*.webp' --exclude '*.ico' --exclude '*.svg' \
            --cache-control 'public, max-age=0, must-revalidate, s-maxage=31536000'
          # filters run in order and the last match wins: repo-only paths are excluded after each include
          # .mjs must be served as JavaScript or the browser refuses the module
          aws s3 sync . "s3://$BUCKET" --delete --exclude '*' --include '*.mjs' "${X[@]}" --content-type 'text/javascript; charset=utf-8' \
            --cache-control 'public, max-age=0, must-revalidate, s-maxage=31536000'
          aws s3 sync . "s3://$BUCKET" --delete --exclude '*' "${IMG[@]}" "${X[@]}" --cache-control 'public, max-age=604800'
          # removes repo-only files an earlier filter order let through (no-op once gone)
          aws s3 rm "s3://$BUCKET/scripts/" --recursive
          aws s3 rm "s3://$BUCKET/i18n/check.mjs"
          id=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST_ID" --id "$id"
