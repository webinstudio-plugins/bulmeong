<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="62%" r="60%">
      <stop offset="0%" stop-color="#2e1309"/>
      <stop offset="55%" stop-color="#120908"/>
      <stop offset="100%" stop-color="#050408"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe79e"/>
      <stop offset="50%" stop-color="#f29f33"/>
      <stop offset="100%" stop-color="#8f380b"/>
    </linearGradient>
    <linearGradient id="outerFlame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ff6a1a"/>
      <stop offset="55%" stop-color="#ff2e17"/>
      <stop offset="100%" stop-color="#ffd059"/>
    </linearGradient>
    <linearGradient id="innerFlame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="65%" stop-color="#ffbc42"/>
      <stop offset="100%" stop-color="#ff6b1a"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Seal Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="url(#goldRing)" stroke-width="4"/>
  <rect x="10" y="10" width="108" height="108" rx="23" fill="none" stroke="#ffd88a" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- Crossed Oak Logs & Hearth Stones -->
  <g transform="translate(0, 4)">
    <rect x="26" y="88" width="76" height="13" rx="6.5" transform="rotate(-11 64 94)" fill="#3b2014" stroke="#ff822e" stroke-width="1.5"/>
    <rect x="26" y="88" width="76" height="13" rx="6.5" transform="rotate(11 64 94)" fill="#2a150d" stroke="#ff9f43" stroke-width="1.5"/>
    <ellipse cx="64" cy="96" rx="26" ry="6" fill="#ff6b1a" opacity="0.55" filter="url(#glow)"/>
    <circle cx="32" cy="100" r="8.5" fill="#252329" stroke="#574b45" stroke-width="1.5"/>
    <circle cx="48" cy="104" r="9.5" fill="#2c2930" stroke="#6b584c" stroke-width="1.5"/>
    <circle cx="64" cy="105" r="10" fill="#232026" stroke="#7a6352" stroke-width="1.5"/>
    <circle cx="80" cy="104" r="9.5" fill="#2c2930" stroke="#6b584c" stroke-width="1.5"/>
    <circle cx="96" cy="100" r="8.5" fill="#252329" stroke="#574b45" stroke-width="1.5"/>
  </g>

  <!-- Volumetric Sacred Alchemy Flame -->
  <g filter="url(#glow)">
    <path d="M64 16 C82 38, 98 55, 92 78 C88 92, 76 98, 64 98 C52 98, 40 92, 36 78 C30 55, 46 38, 64 16 Z" fill="url(#outerFlame)"/>
    <path d="M64 32 C75 49, 84 62, 80 79 C77 89, 71 94, 64 94 C57 94, 51 89, 48 79 C44 62, 53 49, 64 32 Z" fill="url(#innerFlame)"/>
    <path d="M64 52 C70 62, 74 71, 71 82 C69 88, 67 91, 64 91 C61 91, 59 88, 57 82 C54 71, 58 62, 64 52 Z" fill="#fffdf5"/>
  </g>

  <!-- Floating Golden Embers -->
  <circle cx="42" cy="36" r="2.6" fill="#ffe28a"/>
  <circle cx="86" cy="30" r="2.2" fill="#ffd059"/>
  <circle cx="77" cy="19" r="1.8" fill="#fff6d6"/>
</svg>
